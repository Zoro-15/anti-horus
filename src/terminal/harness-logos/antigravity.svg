<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#818cf8" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer Floating Ring (Anti-Gravity field) -->
  <circle cx="256" cy="256" r="180" stroke="url(#glow)" stroke-width="12" stroke-linecap="round" stroke-dasharray="160 50" fill="none" opacity="0.65"/>
  <circle cx="256" cy="256" r="144" stroke="url(#glow)" stroke-width="6" stroke-linecap="round" stroke-dasharray="80 70" fill="none" opacity="0.4"/>
  
  <!-- Central Levitation Delta / Antigravity Monogram -->
  <g filter="url(#shadow)">
    <!-- Upward floating delta core -->
    <path d="M256 120 L376 348 C382 359 374 372 361 372 L312 372 L256 260 L200 372 L151 372 C138 372 130 359 136 348 Z" fill="url(#glow)"/>
    <!-- Floating particle sparkle at apex -->
    <path d="M256 160 L340 332 L296 332 L256 250 L216 332 L172 332 Z" fill="url(#core)"/>
    <circle cx="256" cy="100" r="12" fill="#38bdf8"/>
  </g>
</svg>
