<!doctype html>
<!-- Source for banner.png. Render at 2x: chrome --headless --force-device-scale-factor=2 --default-background-color=00000000 --window-size=880,380 --screenshot=banner.png banner.html -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Michroma; src: url(../../android/app/src/main/assets/fonts/Michroma.ttf); }
@font-face { font-family: Hiero; src: local("Noto Sans Egyptian Hieroglyphs"); }
html, body { margin: 0; background: transparent; }
.card {
  width: 880px; height: 380px; box-sizing: border-box;
  border-radius: 18px; overflow: hidden; position: relative;
  background:
    radial-gradient(ellipse 60% 70% at 50% 48%, rgba(128,235,18,.10), transparent 70%),
    linear-gradient(#0e1311, #0a0d0c);
  border: 1px solid #2a2a1c;
  display: flex; flex-direction: column; align-items: center;
}
.frieze {
  position: absolute; left: 0; right: 0; height: 46px;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
  font-family: Hiero; font-size: 26px; letter-spacing: 9px; white-space: nowrap;
  color: #c9a85a; opacity: .55;
}
.frieze.top { top: 0; border-bottom: 1px solid rgba(201,168,90,.35); }
.frieze.bot { bottom: 0; border-top: 1px solid rgba(201,168,90,.35); }
.frieze::before, .frieze::after { content: ""; position: absolute; left: 0; right: 0; height: 3px;
  background: repeating-linear-gradient(90deg, #c9a85a 0 14px, transparent 14px 20px); opacity: .35; }
.frieze.top::after { bottom: 4px; } .frieze.top::before { display: none; }
.frieze.bot::before { top: 4px; } .frieze.bot::after { display: none; }
.stars { position: absolute; font-family: Hiero; color: #c9a85a; opacity: .22; font-size: 18px; }
.mid { margin-top: 66px; display: flex; flex-direction: column; align-items: center; }
.eye { width: 100px; height: 100px; filter: drop-shadow(0 0 18px rgba(128,235,18,.35)); }
.name { font-family: Michroma; color: #eef3ea; font-size: 46px; letter-spacing: 22px; margin: -8px 0 0 22px; }
.cart {
  margin-top: 22px; display: flex; align-items: center; gap: 22px;
  font-family: Hiero; color: #80EB12;
}
.ring {
  display: flex; align-items: center; gap: 6px;
  border: 2px solid #c9a85a; border-radius: 999px; padding: 2px 22px 2px 18px;
  font-size: 30px; position: relative;
}
.ring::after { content: ""; position: absolute; right: -7px; top: 8px; bottom: 8px; width: 3px; background: #c9a85a; border-radius: 2px; }
.gloss { width: 230px; font-family: Michroma; font-size: 11px; letter-spacing: 3px; color: #8d8a76; }
</style></head>
<body>
<div class="card">
  <div class="frieze top">𓋹𓊽𓌀𓋹𓊽𓌀𓋹𓊽𓌀𓋹𓊽𓌀𓋹𓊽𓌀𓋹𓊽𓌀𓋹𓊽𓌀𓋹𓊽𓌀𓋹𓊽𓌀𓋹𓊽𓌀𓋹𓊽𓌀𓋹𓊽𓌀𓋹𓊽𓌀𓋹𓊽𓌀𓋹𓊽𓌀𓋹𓊽𓌀</div>
  <div class="stars" style="left:70px;top:88px">𓇼</div>
  <div class="stars" style="left:150px;top:220px">𓇼</div>
  <div class="stars" style="left:96px;top:280px;font-size:13px">𓇼</div>
  <div class="stars" style="right:80px;top:96px;font-size:14px">𓇼</div>
  <div class="stars" style="right:150px;top:215px">𓇼</div>
  <div class="stars" style="right:96px;top:280px;font-size:13px">𓇼</div>
  <div class="mid">

</div>
</body></html>
